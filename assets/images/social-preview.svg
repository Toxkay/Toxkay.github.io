<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Toxkay - Offensive Security Engineer</title>
  <desc id="desc">Dark terminal-inspired social preview card for Toxkay's portfolio and security writeups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="490" rx="28" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  </g>

  <g transform="translate(106 108)">
    <rect x="0" y="0" width="988" height="44" rx="14" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="6" fill="#f85149"/>
    <circle cx="46" cy="22" r="6" fill="#d29922"/>
    <circle cx="68" cy="22" r="6" fill="#3fb950"/>
    <text x="96" y="28" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="18">toxkay@kali:~</text>
  </g>

  <g transform="translate(118 188)">
    <text x="0" y="0" fill="#79c0ff" font-family="JetBrains Mono, monospace" font-size="22">$ whoami</text>
    <text x="0" y="42" fill="#f0f6fc" font-family="JetBrains Mono, monospace" font-size="24">toxkay</text>

    <text x="0" y="96" fill="#79c0ff" font-family="JetBrains Mono, monospace" font-size="22">$ cat about.txt</text>
    <text x="0" y="136" fill="#c9d1d9" font-family="Inter, Arial, sans-serif" font-size="20">Offensive Security Engineer  •  Red Teamer  •  Bug Hunter</text>
    <text x="0" y="174" fill="#c9d1d9" font-family="Inter, Arial, sans-serif" font-size="20">Breaking systems. Building knowledge. Sharing both.</text>

    <g transform="translate(0 224)">
      <rect x="0" y="0" width="310" height="52" rx="26" fill="#1f6feb22" stroke="#1f6feb" stroke-opacity="0.35"/>
      <text x="155" y="26" fill="#f0f6fc" font-family="JetBrains Mono, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle">Web AppSec · AD · Red Teaming</text>
    </g>

    <g transform="translate(340 224)">
      <rect x="0" y="0" width="265" height="52" rx="26" fill="#23863622" stroke="#3fb950" stroke-opacity="0.35"/>
      <text x="132.5" y="26" fill="#f0f6fc" font-family="JetBrains Mono, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle">Writeups · Tools · Research</text>
    </g>
  </g>

  <g transform="translate(106 498)">
    <rect x="0" y="0" width="988" height="2" fill="url(#accent)" opacity="0.9"/>
    <text x="0" y="44" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="18">toxkay.github.io</text>
  </g>
</svg>
